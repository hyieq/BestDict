name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG must match package.json version v$version."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install Node dependencies and Electron
        run: npm ci --registry=https://registry.npmjs.org

      - name: Prepare Python environment
        run: |
          uv venv .venv --python python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv/Scripts/python.exe ctranslate2==4.6.0 sentencepiece==0.2.1 setuptools==80.9.0 pillow==12.3.0

      - name: Prepare offline dictionary and embedded Python
        run: .venv/Scripts/python.exe scripts/setup_assets.py

      - name: Prepare CPU inference runtime
        run: .venv/Scripts/python.exe scripts/setup_hy_runtime.py

      - name: Bundle Visual C++ runtime
        run: .venv/Scripts/python.exe scripts/bundle_vc_runtime.py

      - name: Preserve dependency licenses
        run: .venv/Scripts/python.exe scripts/copy_licenses.py

      - name: Prepare installer tools
        run: .venv/Scripts/python.exe scripts/setup_build_tools.py

      - name: Test offline resources
        run: npm test

      - name: Test speech pack installer
        run: .venv/Scripts/python.exe -m unittest discover -s tests -p test_speech_installer.py

      - name: Build Windows x64 installer
        run: |
          npm run package 2>&1 | Tee-Object -FilePath release-build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $tail = (Get-Content release-build.log -Tail 60) -join "`n"
            $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installer build failed::$message"
            exit $buildExit
          }

      - name: Test packaged desktop app
        run: |
          $env:BESTDICT_TEST_EXE = Join-Path $PWD 'release/win-unpacked/BestDict.exe'
          npm run test:desktop 2>&1 | Tee-Object -FilePath release-desktop.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $tail = (Get-Content release-desktop.log -Tail 80) -join "`n"
            $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Packaged desktop test failed::$message"
            exit $testExit
          }

      - name: Test packaged glass UI, query mode and AI menus
        run: |
          $env:BESTDICT_TEST_EXE = Join-Path $PWD 'release/win-unpacked/BestDict.exe'
          foreach ($test in @('test:glass', 'test:query-mode', 'test:ai-styles', 'test:ai-menu', 'test:speech', 'test:settings', 'test:resources-ui', 'test:mini', 'test:capture')) {
            $log = 'release-' + $test.Replace(':', '-') + '.log'
            npm run $test 2>&1 | Tee-Object -FilePath $log
            $testExit = $LASTEXITCODE
            if ($testExit -ne 0) {
              $tail = (Get-Content $log -Tail 80) -join "`n"
              $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=$test failed::$message"
              exit $testExit
            }
          }

      - name: Prepare checksum
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "release/BestDict-$version-x64-Setup.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding utf8

      - name: Save installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BestDict-${{ github.ref_name }}-windows-x64
          path: |
            release/*-Setup.exe
            release/*.sha256
          if-no-files-found: error

      - name: Save desktop test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results-${{ github.ref_name }}
          path: |
            test-results/
            release-*.log
          if-no-files-found: ignore

  macos:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/macos.yml
    with:
      release-build: true

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: BestDict-${{ github.ref_name }}-*
          merge-multiple: true
          path: release
      - name: Verify all three installers and prepare release notes
        run: node scripts/prepare_release.mjs
      - name: Publish complete release
        run: |
          files=(release/BestDict-*-Setup.exe release/BestDict-*-macOS-*.dmg release/*.sha256)
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            node -e "if(!require('./existing-release.json').isDraft) throw new Error('Release is already published; use a new version tag');"
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --draft --title "BestDict $RELEASE_TAG" --notes-file release/release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest --title "BestDict $RELEASE_TAG" --notes-file release/release-notes.md
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets,url
